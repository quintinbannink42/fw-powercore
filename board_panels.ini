		field = "!getDiag() still returns PIN_OK — overload reporting is TODO in rusEFI protected_gpio."
		field = "!E-fuse SM (inrush window, retry, latch, over-temp) is out of scope for this INI pass."
		field = "!Wire that SM on top of protected_gpio / tdg-pdm8 — do not add a parallel layer."
		field = ""
		field = "!Live current: HP1-4 = Aux Linear gauges. ADIO = Lua gauges (script later)."

