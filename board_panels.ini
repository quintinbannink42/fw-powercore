	dialog = pdmOverviewDialog, "PowerCore / PDM"
		field = "!PowerCore is a standalone power distribution module, not an engine ECU."
		field = "!Identity: SHORT_BOARD_NAME / FIRMWARE_ID = powercore"
		field = "!Hardware: Hellen mega-mcu144 + PROFET HP1-4 and ADIO1-8"
		field = ""
		field = "#Channels"
		field = "!HP1-4: e-fuse bank PROTECTED_PIN_0..3, ~60 A OC / 80 A inrush class"
		field = "!ADIO1-4: e-fuse bank PROTECTED_PIN_4..7, ~10 A class"
		field = "!ADIO5-8: e-fuse bank PROTECTED_PIN_8..11 (ADIO6-8 SW OC waits on ADC3)"
		field = ""
		field = "#Outputs"
		field = "!Assign every function under PowerCore -> Outputs. Pin lists are HP1-4 and ADIO1-8."
		field = "!Names match a rusEFI ECU: Fuel Pump, Fan 1, Fan 1 PWM, Starter Control, GP PWM, Main relay, Narrowband O2 heater, A/C Relay."
		field = "!One function per pin. Lua PWM and GP PWM on a pin an ECU function uses are cleared."
		field = "!E-fuse trip, faults, and CAN stay on the sibling pages. Trip: docs/EFUSE.md. CAN: docs/CAN.md."

