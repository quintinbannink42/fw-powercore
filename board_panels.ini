	dialog = pdmFaultsDialog, "Faults / protection"
		field = "!E-fuse SM (docs/EFUSE.md) on the protected_gpio pattern."
		field = "!Fast short: current > inrush limit trips immediately."
		field = "!After inrush window: current > OC limit for trip time trips."
		field = "!Retry then latch, or latch immediately. Reset: command off ~50 ms, tune burn, or power cycle."
		field = "!getDiag() reports PIN_OVERLOAD while the channel is tripped or latched."
		field = ""
		field = "!Live current: HP1-4 = Aux Linear gauges. ADIO1-8 = Lua gauges (firmware-written)."

